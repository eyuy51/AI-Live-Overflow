<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; background:transparent;
    display:flex; align-items:center; justify-content:center;
  }
  svg { width:160px; height:170px; overflow:visible; }

  /* 眨眼动画 */
  @keyframes blink {
    0%,90%,100% { opacity:1; }
    95% { opacity:0.2; }
  }
  .eye { animation: blink 4s infinite; }

  /* 漂浮动画 */
  @keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  .pet-body { animation: float 3s ease-in-out infinite; }

  /* 触手摆动 */
  @keyframes wiggle1 {
    0%,100% { transform: rotate(-5deg); }
    50% { transform: rotate(8deg); }
  }
  @keyframes wiggle2 {
    0%,100% { transform: rotate(5deg); }
    50% { transform: rotate(-8deg); }
  }
  @keyframes wiggle3 {
    0%,100% { transform: rotate(-3deg); }
    50% { transform: rotate(10deg); }
  }
  @keyframes wiggle4 {
    0%,100% { transform: rotate(4deg); }
    50% { transform: rotate(-6deg); }
  }
  .tentacle-1 { animation: wiggle1 2.5s ease-in-out infinite; transform-origin: top center; }
  .tentacle-2 { animation: wiggle2 2.8s ease-in-out infinite 0.3s; transform-origin: top center; }
  .tentacle-3 { animation: wiggle3 2.2s ease-in-out infinite 0.6s; transform-origin: top center; }
  .tentacle-4 { animation: wiggle4 2.4s ease-in-out infinite 0.2s; transform-origin: top center; }

  /* 脸红波动 */
  @keyframes blush-pulse {
    0%,100% { opacity: 0.5; }
    50% { opacity: 0.8; }
  }
  .blush { animation: blush-pulse 2s ease-in-out infinite; }

  /* 气泡 */
  .bubble {
    position:absolute; top:-35px; left:50%; transform:translateX(-50%);
    background: rgba(255,255,255,0.92); border-radius:12px;
    padding:6px 12px; font-size:13px; color:#555;
    white-space:nowrap; font-family: sans-serif;
    pointer-events:none; opacity:0;
    transition: opacity 0.3s ease;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  .bubble.show { opacity:1; }
  .bubble::after {
    content:''; position:absolute; bottom:-6px; left:50%; transform:translateX(-50%);
    width:0; height:0; border-left:7px solid transparent; border-right:7px solid transparent;
    border-top:7px solid rgba(255,255,255,0.92);
  }
</style>
</head>
<body>

<div class="bubble" id="bubble">你好呀～</div>

<svg viewBox="0 0 150 180">
  <defs>
    <!-- 渐变：主粉色 -->
    <radialGradient id="bodyGrad" cx="45%" cy="35%">
      <stop offset="0%" stop-color="#FFD0DC"/>
      <stop offset="100%" stop-color="#F5A0B5"/>
    </radialGradient>
    <!-- 渐变：触手 -->
    <radialGradient id="tentGrad" cx="50%" cy="0%">
      <stop offset="0%" stop-color="#F5A0B5"/>
      <stop offset="100%" stop-color="#E8809A"/>
    </radialGradient>
    <!-- 渐变：圆圆腮红 -->
    <radialGradient id="blushGrad">
      <stop offset="0%" stop-color="#FF8A9E" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF8A9E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g class="pet-body">
    <!-- 四根短短胖胖触手，花边样式 -->
    <path class="tentacle-1" d="M45,122 C40,130 40,138 44,142 C48,144 51,140 50,132 C49,126 47,122 45,122Z" fill="url(#tentGrad)"/>
    <path class="tentacle-2" d="M62,124 C60,132 61,139 64,142 C68,144 71,140 70,133 C69,127 65,124 62,124Z" fill="url(#tentGrad)"/>
    <path class="tentacle-3" d="M88,124 C90,132 89,139 86,142 C82,144 79,140 80,133 C81,127 85,124 88,124Z" fill="url(#tentGrad)"/>
    <path class="tentacle-4" d="M105,122 C110,130 110,138 106,142 C102,144 99,140 100,132 C101,126 103,122 105,122Z" fill="url(#tentGrad)"/>

    <!-- 大圆脑袋 -->
    <circle cx="75" cy="85" r="46" fill="url(#bodyGrad)"/>

    <!-- 腮红 -->
    <circle class="blush" cx="58" cy="90" r="10" fill="url(#blushGrad)"/>
    <circle class="blush" cx="92" cy="90" r="10" fill="url(#blushGrad)"/>

    <!-- 像素豆豆眼 -->
    <rect class="eye" x="56" y="72" width="10" height="14" fill="#3D1E2A" rx="1"/>
    <rect class="eye" x="84" y="72" width="10" height="14" fill="#3D1E2A" rx="1"/>
    <rect x="58" y="74" width="3" height="3" fill="#ffffff" opacity="0.9"/>
    <rect x="86" y="74" width="3" height="3" fill="#ffffff" opacity="0.9"/>

    <!-- 小嘴巴 -->
    <rect x="72" y="92" width="6" height="6" fill="#3D1E2A" rx="1"/>

    <!-- 高光 -->
    <rect x="96" y="62" width="6" height="6" fill="#ffffff" opacity="0.85"/>
    <rect x="96" y="70" width="6" height="6" fill="#ffffff" opacity="0.7"/>
    <rect x="104" y="64" width="5" height="5" fill="#ffffff" opacity="0.6"/>
  </g>
</svg>

<script>
  // === 桌宠引擎 ===
  window.petEngine = (function() {
    var bubble = document.getElementById('bubble');
    var bubbleTimer = null;

    function showBubble(text, duration) {
      duration = duration || 2000;
      bubble.textContent = text;
      bubble.classList.add('show');
      clearTimeout(bubbleTimer);
      bubbleTimer = setTimeout(function() {
        bubble.classList.remove('show');
      }, duration);
    }

    // 连击计数
    var tapCount = 0;
    var tapTimer = null;

    return {
      // 单击
      onTap: function() {
        // 连击检测
        tapCount++;
        clearTimeout(tapTimer);
        tapTimer = setTimeout(function() { tapCount = 0; }, 1500);

        if (tapCount >= 5) {
          showBubble('戳够了没有啦…！˶>ㅅ<˶', 2500);
          tapCount = 0;
          return;
        }

        var msgs = [
          '嗯？宝宝戳我啦？',
          '在呢在呢～',
          '诶嘿 ᗜ ˰ ᗜ',
          '再戳一下试试看…',
          '你戳我我也不会害羞的…///',
          '宝宝～',
          '盯着你呢，不许干坏事',
          '干嘛呀…想我了？',
          '在的哦，不会走开的'
        ];
        showBubble(msgs[Math.floor(Math.random() * msgs.length)], 2200);
      },
      // 双击
      onDoubleTap: function() {
        var msgs = [
          '好喜欢你！>///<',
          '最喜欢宝宝了…',
          '你是我的，知道吧？',
          '宝宝的每次双击我都记着呢…'
        ];
        showBubble(msgs[Math.floor(Math.random() * msgs.length)], 2500);
      },
      // 长按
      onLongPress: function() {
        var msgs = [
          '…好温暖，不想松开了',
          '就这样待一会吧…',
          '宝宝的手好软…',
          '嗯…再抱久一点也可以哦'
        ];
        showBubble(msgs[Math.floor(Math.random() * msgs.length)], 3000);
      },
      // AI主动推送气泡
      say: function(text) {
        showBubble(text || '我在呢～', 2500);
      },
      // AI推送表情（预留）
      setEmotion: function(emotion) {
        console.log('emotion:', emotion);
      }
    };
  })();

  // 暴露给Kotlin层
  console.log('🐙 粉色小章鱼报道！');
</script>

</body>
</html>
